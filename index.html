<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClockOut</title>
<link rel="icon" href="https://raw.githubusercontent.com/sssssseul/ClockOut/main/lotso.png">

<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fdf0f5;
  background-image: radial-gradient(circle, rgba(244,184,208,0.4) 1.5px, transparent 1.5px);
  background-size: 36px 36px; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 2rem 1rem; }
  .wrap { width: 100%; max-width: 480px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; align-items: stretch; }
  .card { background: #fff; border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; min-width: 0; }
  .card-full { grid-column: 1 / -1; }
  .card-label { font-size: 11px; color: #888780; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .card-value { font-size: 24px; font-weight: 500; color: #1a1a18; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1; }
  .hate-btn { width: 100%; margin-top: 8px; padding: 5px 4px; background: #fce8f0; border: 1px solid #f4b8d0; border-radius: 8px; font-size: 10px; color: #993556; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; }
  .hate-btn:active { background: #ffe0e0; }
  .hate-btn.pressed { background: #f5f5f5; border-color: #ddd; color: #aaa; cursor: default; }
  .lunch-btn { width: 100%; margin-top: 8px; padding: 5px 4px; background: #fce8f0; border: 1px solid #f4b8d0; border-radius: 8px; font-size: 10px; color: #993556; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; }
  .lunch-btn.done { background: #f5f5f5; border-color: #ddd; color: #aaa; }

  .card-sub-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .card-sub { font-size: 12px; color: #888780; }
  .muted { font-size: 16px; font-weight: 400; color: #888780; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-family: 'Noto Sans KR', sans-serif; }
  .badge-work { background: rgb(252,232,241); color: rgb(153,53,86); }
  .badge-done { background: #fce8f0; color: #993556; }
  .badge-before { background: #FAEEDA; color: #854F0B; }
  .badge-lunch { background: #f1efea; color: #5F5E5A; border: 0.5px solid #f4c0d1; }
  .blocks-card { background: #fff; border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .blocks-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .blocks-label { font-size: 11px; color: #888780; display: flex; align-items: center; gap: 5px; }
  .lunch-toggle label { font-size: 11px; color: #888780; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .lunch-toggle input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; border: 1px solid #888780; border-radius: 3px; margin: 0; cursor: pointer; position: relative; flex-shrink: 0; }
  .lunch-toggle input[type="checkbox"]:checked { background: rgb(153,53,86); border-color: rgb(153,53,86); }
  .lunch-toggle input[type="checkbox"]:checked::after { content: ''; position: absolute; left: 2px; top: 0px; width: 4px; height: 7px; border: 1.5px solid #fff; border-top: none; border-left: none; transform: rotate(45deg); }
  .blocks-wrap { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .block { border-radius: 5px; height: 24px; }
  .block.done { background: #F4C0D1; border: 1px solid #993556; }
  .block.current { background: rgb(252,232,241); border: 1px solid rgb(153,53,86); }
  .block.remaining { background: #f1efea; border: 1px solid #888780; opacity: 0.4; }
  .block.lunch { background: #D3D1C7; border: 1px solid #444441; }
  .block.lunch.done { background: #B4B2A9; border: 1px solid #2C2C2A; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .leg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #888780; }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .dot-done { background: #F4C0D1; border: 1px solid #993556; }
  .dot-current { background: rgb(252,232,241); border: 1px solid rgb(153,53,86); }
  .dot-rem { background: #f1efea; border: 1px solid #888780; opacity: 0.4; }
  .dot-lunch { background: #D3D1C7; border: 1px solid #444441; }
  .settings-card { background: #fff; border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .settings-label { font-size: 11px; color: #888780; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .preset-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .preset-option { position: relative; }
  .preset-option input[type="radio"] { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .preset-option label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; border: 1px solid #f4c0d1; border-radius: 8px; cursor: pointer; font-size: 10.5px; color: #888780; line-height: 1.3; text-align: center; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; }
  .preset-option input[type="radio"]:checked + label { border-color: rgb(153,53,86); background: rgb(252,232,241); color: rgb(153,53,86); font-weight: 500; }
  .custom-card { background: #fff; border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .custom-card label { font-size: 11px; color: #888780; white-space: nowrap; display: flex; align-items: center; gap: 4px; flex-shrink: 0; width: 38px; font-family: 'Noto Sans KR', sans-serif; }
  .custom-card select { flex: 1; min-width: 0; font-size: 12px; color: #888780; border: 0.5px solid #f4c0d1; border-radius: 6px; padding: 4px 8px; background: #f2f1ef; outline: none; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
  .custom-card select:focus { border-color: rgb(153,53,86); }
  
  /* --- 방명록 대댓글 수직선 완벽 수정 시스템 --- */
  .chat-card { background: #fff; border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 12px 14px; margin-top: 8px; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
  .placard { font-size: 11.5px; font-weight: 500; color: #444441; text-align: center; margin-bottom: 8px; }
  .placard span { background: linear-gradient(transparent 40%, rgba(255,150,180,0.5) 40%); padding: 0 2px; }
  .notice-wrap { background: transparent; border: none; height: auto; overflow: visible; margin-bottom: 8px; display: none; position: relative; text-align: center; box-shadow: none; }
  .lotso-img { position: fixed; pointer-events: none; z-index: 0; opacity: 0.25; }
  .lotso-img2 { position: fixed; pointer-events: none; z-index: 0; opacity: 0.25; }
  @media (min-width: 600px) {
    .lotso-img { width: 160px; bottom: 60px; right: calc(50% - 560px); }
    .lotso-img2 { display: block; width: 140px; top: 30%; left: calc(50% - 580px); }
  }
  @media (max-width: 599px) {
    .lotso-img { width: 130px; bottom: 20px; right: 10px; }
    .lotso-img2 { display: block; width: 100px; top: 60px; left: 10px; }
  }
  .notice-inner { display: inline-block; white-space: nowrap; font-size: 11.5px; font-weight: 400; color: #1a1a18; padding: 0; animation: shake 0.8s ease-in-out infinite; }
  .notice-inner span { display: inline-block; vertical-align: middle; background: linear-gradient(transparent 38%, rgba(255,150,180,0.55) 38%); padding: 0 3px; }
  .notice-edit-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #7f1d1d; font-size: 13px; padding: 0; cursor: pointer; display: none; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-3px)} 40%{transform:translateX(3px)} 60%{transform:translateX(-2px)} 80%{transform:translateX(2px)} }
  .chat-nickname { font-size: 11px; color: rgb(153,53,86); background: rgb(252,232,241); padding: 2px 8px; border-radius: 99px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
  .photo-view-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
  .photo-view-img { max-width: 95vw; max-height: 90vh; border-radius: 12px; object-fit: contain; }
  .nick-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
  .nick-box { background: #fff; border-radius: 16px; padding: 20px; width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; max-height: 80vh; }
  .nick-box h3 { font-size: 13px; color: #993556; margin: 0; }
  .nick-list { overflow-y: auto; max-height: 240px; display: flex; flex-direction: column; gap: 4px; }
  .nick-item { font-size: 12px; padding: 8px 12px; border-radius: 8px; cursor: pointer; background: #f2f1ef; color: #1a1a18; }
  .nick-item:hover { background: #fce8f0; color: #993556; }
  .nick-pw-input { font-size: 12px; border: 0.5px solid #f4c0d1; border-radius: 8px; padding: 8px 10px; font-family: 'Noto Sans KR', sans-serif; outline: none; width: 100%; box-sizing: border-box; }
  .nick-confirm-btn { background: #993556; color: #fff; border: none; border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .nick-cancel-btn { background: #f2f1ef; color: #888780; border: 0.5px solid #e0dfd8; border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .chat-messages { display: flex; flex-direction: column; margin-bottom: 8px; }
  .chat-thread-group { display: flex; flex-direction: column; gap: 6px; width: 100%; position: relative; margin-bottom: 6px; }
  .chat-thread-group:last-child { margin-bottom: 0; }

  
  /* 기본 댓글 및 대댓글 박스 속성 */
  .chat-msg { 
    font-size: 12px; 
    background: #f2f1ef; 
    border-radius: 8px;
    padding: 8px 10px; 
    display: flex; 
    align-items: flex-start; 
    justify-content: space-between; 
    gap: 8px; 
    position: relative; 
    width: 100%; 
  }
  
  .chat-msg.mine { background: rgb(252,232,241) !important; }
  .chat-msg.reply-msg { background: #fffde7; }
  .chat-msg.reply-msg.mine { background: rgb(252,232,241) !important; }

  .reply-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 0;
    margin-left: 16px;
    padding-left: 8px;
    border-left: 2px solid #e0dfd8;
    width: calc(100% - 16px);
  }
  
  .chat-msg-body { display: flex; flex-direction: column; width: 100%; gap: 6px; }
  .chat-msg-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .chat-msg-nick-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chat-msg-bottom { font-size: 12px; line-height: 1.4; color: #1a1a18; word-break: break-all; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .my-actions { display: flex; align-items: center; gap: 3px; }
  .my-edit-btn { background: none; border: none; font-size: 11px; color: #ccc; cursor: pointer; padding: 0; line-height: 1; }
  .my-edit-btn:hover { color: #993556; }
  .my-del-btn { background: none; border: none; font-size: 11px; color: #ccc; cursor: pointer; padding: 0; line-height: 1; }
  .my-del-btn:hover { color: #e05a5a; }
  .edit-mode-wrap { background: rgb(252,232,241); border-radius: 8px; padding: 8px 10px; }
  .edit-mode-input { width: 100%; font-size: 12px; border: 1px solid #f4b8d0; border-radius: 6px; padding: 6px 8px; font-family: 'Noto Sans KR', sans-serif; resize: none; outline: none; background: #fff; box-sizing: border-box; }
  .edit-mode-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
  .edit-save-btn { background: #993556; color: #fff; border: none; border-radius: 6px; padding: 4px 12px; font-size: 10px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .edit-cancel-btn { background: none; border: 1px solid #e0dfd8; border-radius: 6px; padding: 4px 12px; font-size: 10px; color: #888780; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .chat-msg-text { flex: 1; }
  .like-btn { background: none; border: 1px solid #e0dfd8; border-radius: 99px; padding: 2px 8px; font-size: 10px; color: #888780; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 3px; font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0; min-width: 36px; }
  .like-btn:hover { background: #f1efea; }
  .chat-msg .chat-msg-nick { color: rgb(153,53,86); font-weight: 500; }
  .chat-msg .chat-msg-time { color: #aaa; font-size: 10px; flex-shrink: 0; }
  
  .badge-siren-text { display: inline-flex; align-items: center; justify-content: center; background-color: #ffebeb; color: #e74c3c; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 99px; border: 1px solid #f9d5d5; line-height: 1; vertical-align: middle; }
  .badge-boom-text { display: inline-flex; align-items: center; justify-content: center; background-color: #fffbeb; color: #d97706; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 99px; border: 1px solid #fde68a; line-height: 1; vertical-align: middle; }
  
  .chat-empty { font-size: 12px; color: #aaa; text-align: center; padding: 12px 0; }
  
  /* 페이지네이션 */
  .chat-pagination { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px 0; }
  .chat-pagination button { background: none; border: 0.5px solid #f4c0d1; border-radius: 6px; padding: 4px 10px; font-size: 11px; color: #888780; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .chat-pagination button:hover { background: #f1efea; }
  .chat-pagination button:disabled { opacity: 0.3; cursor: default; }
  .chat-pagination .page-info { font-size: 11px; color: #888780; }

  /* 입력 창 및 답글 바 */
  .chat-input-area { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-top: 4px; }
  
  .reply-target-bar { display: none; align-items: center; justify-content: space-between; background: #e2e8f0; padding: 6px 12px; border-radius: 8px; font-size: 11px; color: #475569; }
  .reply-target-bar button { 
    background: #fff; 
    border: 0.5px solid #cbd5e1; 
    border-radius: 4px; 
    color: #64748b; 
    font-size: 10px; 
    padding: 2px 6px; 
    cursor: pointer; 
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
  }
  .reply-target-bar button:hover { 
    background: #fff5f5; 
    border-color: #fca5a5; 
    color: #c0392b; 
  }
  
  .chat-input-row { display: flex; gap: 6px; }
  .chat-input-row input { flex: 1; min-width: 0; font-size: 12px; color: #5F5E5A; border: 0.5px solid #f4c0d1; border-radius: 6px; padding: 6px 10px; background: #f2f1ef; outline: none; font-family: 'Noto Sans KR', sans-serif; }
  .chat-input-row input:focus { border-color: rgb(153,53,86); }
  .chat-input-row button { background: rgb(153,53,86); color: #fff; border: none; border-radius: 6px; width: 32px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .chat-input-row button:hover { background: rgb(120,30,65); }
  
  .chat-refresh-btn { background: none; border: 0.5px solid #f4c0d1; border-radius: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #888780; }
  .chat-refresh-btn:hover { background: #f1efea; }
  
  .admin-panel { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: 6px; }
  .admin-dashboard { background: rgba(255,255,255,0.88); border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 12px 14px; margin-top: 8px; margin-bottom: 8px; display: none; }
  .admin-dashboard-header { font-size: 11px; color: #888780; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .stat-box { background: #fce8f0; border-radius: 8px; padding: 8px; text-align: center; }
  .stat-box-label { font-size: 10px; color: #993556; margin-bottom: 2px; }
  .stat-box-value { font-size: 18px; font-weight: 500; color: #1a1a18; }
  .stat-chart { margin-top: 8px; }
  .stat-chart-label { font-size: 10px; color: #888780; margin-bottom: 4px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 3px; height: 50px; }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; height: 100%; justify-content: flex-end; }
  .chart-bar { width: 100%; background: #f4b8d0; border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-date { font-size: 8px; color: #aaa; white-space: nowrap; }
  .chart-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .chart-tab { font-size: 10px; padding: 2px 8px; border-radius: 99px; border: 1px solid #f4c0d1; color: #888780; cursor: pointer; background: none; font-family: 'Noto Sans KR', sans-serif; }
  .chart-tab.active { background: #fce8f0; color: #993556; border-color: #993556; }
  .admin-btn { background: none; border: 0.5px solid #f4c0d1; border-radius: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }
  .admin-btn:hover { background: #f1efea; }
  
  .msg-action-btn { background: none; border: none; cursor: pointer; font-size: 11px; color: rgb(153,53,86); padding: 0; font-family: 'Noto Sans KR', sans-serif; margin-left: 8px; font-weight: 500; }
  .msg-action-btn:hover { text-decoration: underline; }
  .siren-btn, .boom-btn, .delete-btn { background: none; border: none; cursor: pointer; font-size: 12px; padding: 0 2px; }
  .delete-btn { color: #ccc; }
  .delete-btn:hover { color: #e05a5a; }
  .king-card { background: rgba(255,255,255,0.88); border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 8px 10px; }
  .king-header { font-size: 11px; color: #888780; font-weight: 400; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .kings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; margin-bottom: 8px; }
  .king-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .king-rank { font-size: 13px; flex-shrink: 0; }
  .king-nick { font-size: 11px; color: #1a1a18; font-weight: 400; flex: 1; min-width: 0; }
  .king-count { font-size: 9px; color: #993556; background: #fce8f0; padding: 1px 5px; border-radius: 99px; flex-shrink: 0; white-space: nowrap; }
  .king-divider { display: none !important; }
  .photo-carousel-card { background: #fff; border: 0.5px solid #f4c0d1; border-radius: 12px; padding: 12px 14px; margin-top: 8px; margin-bottom: 8px; }
  .photo-carousel-header { font-size: 11px; color: #888780; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 5px; }
  .photo-carousel-wrap { overflow: hidden; position: relative; }
  .photo-carousel-track { display: flex; transition: transform 0.3s ease; }
  .photo-card-item { flex: 0 0 100%; display: flex; align-items: stretch; background: #f2f1ef; border-radius: 10px; overflow: hidden; min-height: 80px; }
  .photo-card-img { width: 80px; height: 80px; object-fit: cover; flex-shrink: 0; background: #f4c0d1; cursor: pointer; margin-right: 2px; }
  .photo-card-info { padding: 10px 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .photo-card-nick { font-size: 11px; color: #993556; font-weight: 500; }
  .photo-card-text { font-size: 12px; color: #1a1a18; line-height: 1.4; word-break: break-all; }
  .photo-card-time { font-size: 10px; color: #aaa; }
  .photo-carousel-dots { display: flex; justify-content: center; gap: 4px; margin-top: 8px; }
  .photo-dot { width: 6px; height: 6px; border-radius: 99px; background: #f4c0d1; cursor: pointer; transition: background 0.2s; }

<script>
const LUNCH_DEFAULT = {start: 11*60+30, end: 13*60};
const LUNCH_ALT     = {start: 12*60,    end: 13*60};
const PRESETS=[
  {start:'08:00', end:'17:00'},{start:'08:30', end:'17:30'},
  {start:'09:00', end:'18:00'},{start:'09:30', end:'18:30'},
  {start:'10:00', end:'19:00'}
];

function getMins(str){const[h,m]=str.split(':').map(Number);return h*60+m;}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return[h,m,ss].map(n=>String(n).padStart(2,'0')).join(':');}
function fmtLabel(t){
  const[h,m]=t.split(':').map(Number);
  const ampm=h<12?'오전':'오후';
  const hh=h===0?12:h>12?h-12:h;
  return ampm+' '+hh+':'+String(m).padStart(2,'0');
}

function buildOptions(selectEl, defaultVal){
  for(let t=0;t<24*60;t+=30){
    const h=Math.floor(t/60),m=t%60;
    const val=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    const opt=document.createElement('option');
    opt.value=val;opt.textContent=fmtLabel(val);
    if(val===defaultVal)opt.selected=true;
    selectEl.appendChild(opt);
  }
}

const startSelect=document.getElementById('start-time');
const endSelect=document.getElementById('end-time');
const savedStart=localStorage.getItem('clockout-start')||'09:00';
const savedEnd=localStorage.getItem('clockout-end')||'18:00';
buildOptions(startSelect,savedStart);
buildOptions(endSelect,savedEnd);

const lunchAltEl=document.getElementById('lunch-alt');
lunchAltEl.checked=localStorage.getItem('clockout-lunch-alt')==='true';
lunchAltEl.addEventListener('change',()=>{
  localStorage.setItem('clockout-lunch-alt',lunchAltEl.checked);tick();
});

const presetGrid=document.getElementById('preset-grid');
function findMatchingPresetIdx(s,e){return PRESETS.findIndex(p=>p.start===s&&p.end===e);}
let selectedIdx=findMatchingPresetIdx(savedStart,savedEnd);
PRESETS.forEach((p,i)=>{
  const wrap=document.createElement('div');wrap.className='preset-option';
  const id='preset-'+i;
  const input=document.createElement('input');
  input.type='radio';input.name='preset';input.id=id;input.value=i;
  if(i===selectedIdx)input.checked=true;
  const label=document.createElement('label');
  label.setAttribute('for',id);
  label.innerHTML=fmtLabel(p.start)+'<br>~ '+fmtLabel(p.end);
  wrap.appendChild(input);wrap.appendChild(label);presetGrid.appendChild(wrap);
  input.addEventListener('change',()=>{startSelect.value=p.start;endSelect.value=p.end;saveAndTick();});
});

function uncheckPresets(){document.querySelectorAll('input[name="preset"]').forEach(r=>r.checked=false);}
function syncPresetCheck(){
  const idx=findMatchingPresetIdx(startSelect.value,endSelect.value);
  uncheckPresets();
  if(idx!==-1){const t=document.getElementById('preset-'+idx);if(t)t.checked=true;}
}
function saveAndTick(){
  localStorage.setItem('clockout-start',startSelect.value);
  localStorage.setItem('clockout-end',endSelect.value);
  syncPresetCheck();tick();
}
startSelect.addEventListener('change',saveAndTick);
endSelect.addEventListener('change',saveAndTick);

function tick(){
  const now=new Date();
  const nowMins=now.getHours()*60+now.getMinutes();
  const nowSecs=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const nowClockEl=document.getElementById('now-clock');
  const curH=now.getHours();
  const curAmPm=curH<12?'오전':'오후';
  const curHH=curH===0?12:curH>12?curH-12:curH;
  nowClockEl.textContent='('+curAmPm+' '+curHH+':'+String(now.getMinutes()).padStart(2,'0')+')';
  const lunch=lunchAltEl.checked?LUNCH_ALT:LUNCH_DEFAULT;
  const LUNCH_START_MINS=lunch.start,LUNCH_END_MINS=lunch.end;
  const startMins=getMins(startSelect.value),endMins=getMins(endSelect.value);
  const startSecs=startMins*60,endSecs=endMins*60;
  const blocks=[];
  for(let t=startMins;t<endMins;t+=30)blocks.push({start:t,end:Math.min(t+30,endMins)});
  const blocksEl=document.getElementById('blocks');
  blocksEl.innerHTML='';
  let completed=0,total=0;
  blocks.forEach(b=>{
    const div=document.createElement('div');
    const mid=(b.start+b.end)/2;
    const isLunch=mid>=LUNCH_START_MINS&&mid<=LUNCH_END_MINS;
    if(!isLunch)total++;
    if(isLunch){div.className=nowMins>=b.end?'block lunch done':'block lunch';}
    else if(nowMins>=b.end){div.className='block done';completed++;}
    else if(nowMins>=b.start&&nowMins<b.end){div.className='block current';}
    else{div.className='block remaining';}
    blocksEl.appendChild(div);
  });
  const isLunch=nowMins>=LUNCH_START_MINS&&nowMins<LUNCH_END_MINS;
  const cdEl=document.getElementById('countdown');
  const badge=document.getElementById('badge');
  const sub=document.getElementById('sublabel');
  const setsVal=document.getElementById('sets-val');
  const setsTotal=document.getElementById('sets-total');
  setsTotal.textContent=' / '+total;
  if(nowMins<startMins){
    cdEl.textContent=fmt(Math.max(0,startSecs-nowSecs));
    badge.className='badge badge-before';badge.textContent='출근 전';
    sub.textContent='출근까지';setsVal.childNodes[0].textContent='--';setsTotal.textContent='';
  }else if(nowSecs>=endSecs){
    cdEl.textContent='퇴근!';
    badge.className='badge badge-done';badge.textContent='완료';
    sub.textContent='수고하셨습니다';setsVal.childNodes[0].textContent=total;
  }else if(isLunch){
    cdEl.textContent=fmt(Math.max(0,endSecs-nowSecs));
    badge.className='badge badge-lunch';badge.textContent='점심시간';
    sub.textContent='퇴근까지';setsVal.childNodes[0].textContent=completed;
  }else{
    cdEl.textContent=fmt(Math.max(0,endSecs-nowSecs));
    badge.className='badge badge-work';badge.textContent='근무 중';
    sub.textContent='퇴근까지';setsVal.childNodes[0].textContent=completed;
  }
}

// --- 일하기 싫다 로직 ---
const todayKST=new Date(new Date().getTime()+9*60*60*1000).toISOString().slice(0,10);
const hateKey='clockout-hate-'+todayKST;
const hateBtn=document.getElementById('hate-btn');
const hateCount=document.getElementById('hate-count');

async function loadHate(){
  try{const res=await fetch('/api/hate');const data=await res.json();hateCount.textContent=data.count;}
  catch(e){hateCount.textContent='?';}
}
async function pressHate(){
  if(localStorage.getItem(hateKey))return;
  try{
    const res=await fetch('/api/hate',{method:'POST'});
    const data=await res.json();
    hateCount.textContent=data.count;
    localStorage.setItem(hateKey,'true');
    hateBtn.innerHTML='퇴근하세요ㅋ';
    hateBtn.classList.add('pressed');
  }catch(e){}
}
if(localStorage.getItem(hateKey)){hateBtn.innerHTML='퇴근하세요ㅋ';hateBtn.classList.add('pressed');}
hateBtn.addEventListener('click',pressHate);
loadHate();

// --- 점심 기요틴 룰렛 시스템 ---
const MENUS = [
  '김치찌개','된장찌개','순두부찌개','부대찌개','설렁탕','순대국밥','비빔밥','냉면',
  '삼겹살','제육볶음','닭갈비','갈비탕','육개장','삼계탕','도시락','쌈밥',
  '쭈꾸미볶음','오므라이스','덮밥','초계국수','칼국수','수제비','닭볶음탕',
  '생선구이','비빔국수','짜장면','짬뽕','탕수육','마라탕','마라샹궈',
  '초밥','라멘','돈까스','우동','소바','규동','오야코동','텐동',
  '파스타','피자','햄버거','샌드위치','샐러드','리조또',
  '김밥','순대','어묵','떡볶이','라볶이',
  '카레','쌀국수','팟타이','케밥','타코','인도커리','훠궈',
  '낙지볶음','오징어볶음','두부김치','미역국','만두','물냉면','비빔냉면',
  '콩나물국밥','해장국','샤브샤브','스시','순대국','가츠동','굴국밥','비빔면',
  '굶기ㅠ'
];
const lunchBtn = document.getElementById('lunch-btn');
const lunchResult = document.getElementById('lunch-result');
let lunchSpinning = false;
lunchBtn.addEventListener('click', ()=>{
  if(lunchSpinning) return;
  lunchSpinning = true;
  lunchBtn.classList.remove("done");
  lunchBtn.textContent = '두근두근...';
  lunchBtn.disabled = true;
  let count = 0;

function fmtPhotoTime(ts){
  const d = new Date(ts*1000);
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h < 12 ? '오전' : '오후';
  const hh = h===0?12:h>12?h-12:h;
  return yy+'-'+mm+'-'+dd+' '+ampm+' '+hh+':'+String(m).padStart(2,'0');
}

function renderCarousel(){

function rebindFileInput(){
  const inp = document.getElementById('photo-file-input');
  if(inp) inp.addEventListener('change', handleFileSelect);
}
function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      const max = 800;
      let w = img.width, h = img.height;
      if(w > h){
        if(w > max){ h = Math.round(h * (max / w)); w = max; }
      } else {
        if(h > max){ w = Math.round(w * (max / h)); h = max; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      selectedImageBase64 = canvas.toDataURL("image/jpeg", 0.95);
      // 미리보기 업데이트 - input 태그 유지
      const previewArea = document.getElementById('photo-preview-area');
      let imgEl = previewArea.querySelector('img');
      if(!imgEl){
        imgEl = document.createElement('img');
        imgEl.style.width = '100%';
        imgEl.style.height = '100%';
        imgEl.style.objectFit = 'cover';
        const span = previewArea.querySelector('span');
        if(span) span.remove();
        previewArea.insertBefore(imgEl, previewArea.firstChild);
      }
      imgEl.src = selectedImageBase64;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

const ANIMAL_EMOJI={
  "돼지":"🐷","다람쥐":"🐿️","펭귄":"🐧","햄스터":"🐹",
  "여우":"🦊","고래":"🐳","토끼":"🐰","부엉이":"🦉",
  "거북이":"🐢","수달":"🦦","코알라":"🐨","사자":"🦁",
  "너구리":"🦝","오리":"🦆","곰":"🐻","강아지":"🐶",
  "물개":"🦭","기린":"🦒","판다":"🐼","라마":"🦙"
};
function addEmojiToNickname(nickname){
  if(!nickname)return nickname;
  const firstChar=nickname.codePointAt(0);
  if(firstChar>0x1F000)return nickname;
  for(const noun in ANIMAL_EMOJI){if(nickname.includes(noun))return ANIMAL_EMOJI[noun]+' '+nickname;}
  return nickname;
}

const chatMessagesEl=document.getElementById('chat-messages');
const paginationEl=document.getElementById('chat-pagination');

const pageNextEl=document.getElementById('page-next');

let allMessages=[], isAdmin=false, adminPassword='';
let selectedParentId = null;

let currentPage = 0;
const PAGE_SIZE = 6; 

function escapeHtml(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML;}

// 메인 방명록 트리 빌드엔진
function renderPage(){
  const rootMessages = allMessages.filter(m => m.parent_id === null || m.parent_id === undefined);
  const totalRoots = rootMessages.length;
  const totalPages = Math.ceil(totalRoots / PAGE_SIZE) || 1;
  
  if(currentPage >= totalPages) currentPage = totalPages - 1;
  if(currentPage < 0) currentPage = 0;
  
  if(allMessages.length===0){
    chatMessagesEl.innerHTML='<div class="chat-empty">아직 방명록이 비어있어요. 첫 글을 남겨보세요!</div>';
    paginationEl.style.display='none';
    return;
  }
  
  chatMessagesEl.innerHTML='';
  
  const start = currentPage * PAGE_SIZE;
  const pageRoots = rootMessages.slice(start, start + PAGE_SIZE);
  
  pageRoots.forEach(root => {
    const threadGroup = document.createElement('div');
    threadGroup.className = 'chat-thread-group';
    
    // 1. 원댓글 추가
    const rootDiv = buildMessageDOM(root, false);
    threadGroup.appendChild(rootDiv);
    
    // 2. 대댓글 추출
    const replies = allMessages.filter(m => m.parent_id === root.id).sort((a,b)=> a.id - b.id);
    
    if(replies.length > 0) {
      const replyContainer = document.createElement('div');
      replyContainer.className = 'reply-container';
      
      replies.forEach(reply => {
        const replyDiv = buildMessageDOM(reply, true);
        replyContainer.appendChild(replyDiv);
      });
      
      threadGroup.appendChild(replyContainer);
    }
    
    chatMessagesEl.appendChild(threadGroup);
  });
  
  paginationEl.style.display = totalPages > 1 ? 'flex' : 'none';
  pageInfoEl.textContent = (currentPage + 1) + ' / ' + totalPages;
  pagePrevEl.disabled = currentPage === 0;
  pageNextEl.disabled = currentPage >= totalPages - 1;
}

        }catch(e){ alert('오류 발생'); }
      });
      // Ctrl+Enter로 저장
      textarea.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' && e.ctrlKey){ e.preventDefault(); actions.querySelector('.edit-save-btn').click(); }
      });
    });
    body.querySelector('.my-del-btn').addEventListener('click', async()=>{
      if(!confirm('내 댓글을 삭제할까요?')) return;
      try{
        const res = await fetch('/api/guestbook/'+m.id, {
          method:'DELETE', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({isOwner: true, nickname: myNickname})
        });
        if(res.ok) loadGuestbook(); else alert('삭제 실패');
      }catch(e){ alert('오류 발생'); }
    });
  }
  const likeBtn = body.querySelector('.like-btn');
  if(likeBtn){
    const likeKey = 'like-'+m.id;
    if(localStorage.getItem(likeKey)){
      likeBtn.style.opacity='0.5';
      likeBtn.style.cursor='default';
    }
  }
  div.appendChild(body);

  if(isAdmin){
    const adminPanel=document.createElement('div');
    adminPanel.className='admin-panel';
    const sirenBtn=document.createElement('button');
    sirenBtn.className='siren-btn';
    sirenBtn.textContent=m.has_siren?'🚨✕':'🚨';
    sirenBtn.addEventListener('click',()=>setSiren(m.id));
    adminPanel.appendChild(sirenBtn);
    const boomBtn=document.createElement('button');
    boomBtn.className='boom-btn';
    boomBtn.textContent=m.has_boom?'👍✕':'👍';
    boomBtn.addEventListener('click',()=>setBoom(m.id));
    adminPanel.appendChild(boomBtn);
    const delBtn=document.createElement('button');
    delBtn.className='delete-btn';delBtn.textContent='🗑️';
    delBtn.addEventListener('click',()=>deleteMsg(m.id));
    adminPanel.appendChild(delBtn);
    div.appendChild(adminPanel);
  }
  return div;
}

pagePrevEl.addEventListener('click',()=>{if(currentPage>0){currentPage--;renderPage();}});
pageNextEl.addEventListener('click',()=>{currentPage++;renderPage();});

// 좋아요 이벤트 위임
chatMessagesEl.addEventListener('click', async(e)=>{
  const btn = e.target.closest('.like-btn');
  if(!btn) return;
  e.stopPropagation();
  const id = btn.dataset.id;
  const likeKey = 'like-'+id;
  const liked = localStorage.getItem(likeKey);
  try{
    if(liked){
      const res = await fetch('/api/guestbook/'+id+'/like', {method:'DELETE'});
      const data = await res.json();
      btn.innerHTML = '<img src="https://raw.githubusercontent.com/sssssseul/ClockOut/main/lotso.png" style="width:13px;height:13px;vertical-align:middle;">'+(data.count ? ' '+data.count : '');
      btn.style.opacity = '1';
      localStorage.removeItem(likeKey);
    } else {
      const res = await fetch('/api/guestbook/'+id+'/like', {method:'POST'});
      const data = await res.json();
      btn.innerHTML = '<img src="https://raw.githubusercontent.com/sssssseul/ClockOut/main/lotso.png" style="width:13px;height:13px;vertical-align:middle;">'+(data.count ? ' '+data.count : '');
      btn.style.opacity = '0.5';
      localStorage.setItem(likeKey, 'true');
    }
  }catch(err){}
});

window.initReply = function(id, nick) {
  selectedParentId = id;
  const bar = document.getElementById('reply-target-bar');
  const txt = document.getElementById('reply-target-text');
  txt.textContent = `💬 ${nick} 님에게 답글 작성 중`;
  bar.style.display = 'flex';
  document.getElementById('chat-input').focus();
};

document.getElementById('cancel-reply-btn').addEventListener('click', () => {
  selectedParentId = null;
  document.getElementById('reply-target-bar').style.display = 'none';
});

async function setSiren(id){
  const m = allMessages.find(x=>x.id===id);
  const msg = m && m.has_siren ? '이 댓글의 🚨 경고를 취소할까요?' : '이 댓글에 🚨 경고 뱃지를 부여할까요?';
  if(!confirm(msg))return;
  try{
    const res=await fetch('/api/guestbook/'+id+'/siren',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:adminPassword})
    });
    if(res.ok)loadGuestbook();else alert('경고 처리 실패');
  }catch(e){alert('오류 발생');}
}
async function setBoom(id){
  const m = allMessages.find(x=>x.id===id);
  const msg = m && m.has_boom ? '이 댓글의 👍 붐업을 취소할까요?' : '이 댓글에 👍 붐업 뱃지를 부여할까요?';
  if(!confirm(msg))return;
  try{
    const res=await fetch('/api/guestbook/'+id+'/boom',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:adminPassword})
    });
    if(res.ok)loadGuestbook();else alert('붐업 처리 실패');
  }catch(e){alert('오류 발생');}
}
async function deleteMsg(id){
  if(!confirm('이 댓글을 삭제할까요? (답글이 함께 삭제될 수 있습니다)'))return;
  try{
    const res=await fetch('/api/guestbook/'+id,{
      method:'DELETE',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:adminPassword})
    });
    if(res.ok)loadGuestbook();else alert('삭제 실패');
  }catch(e){alert('오류 발생');}
}

document.getElementById('admin-btn').addEventListener('click',()=>{
  if(isAdmin){
    isAdmin=false;adminPassword='';
    document.getElementById('admin-btn').textContent='🔑';
    document.getElementById('admin-dashboard').style.display='none';
    noticeEditBtn.style.display='none';
    if(!noticeInner.textContent.trim()) noticeWrap.style.display='none';
    renderPage();return;
  }
  const pw=prompt('관리자 비밀번호를 입력하세요:');
  if(pw===null)return;
  if(pw!=='0530'){alert('비밀번호가 틀렸습니다.');return;}
  adminPassword=pw;isAdmin=true;
  // 관리자 닉네임 고정
  myNickname='🐳 졸린 고래';
  localStorage.setItem('clockout-nickname', myNickname);
  document.getElementById('my-nickname').textContent=myNickname;
  document.getElementById('admin-btn').textContent='🔓';
  document.getElementById('admin-dashboard').style.display='block';
  loadStats();
  noticeWrap.style.display='block';
  noticeEditBtn.style.display='block';
  renderPage();
});

async function loadGuestbook(){
  try{
    const res=await fetch('/api/guestbook');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    allMessages=data.messages||[];
    renderPage();
  }catch(e){
    console.error('loadGuestbook error:', e);
    chatMessagesEl.innerHTML='<div class="chat-empty">불러오기 실패: '+e.message+'</div>';
  }
}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  try{
    await fetch('/api/guestbook',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({nickname:myNickname, text: text, parent_id: selectedParentId})
    });
    selectedParentId = null;
    document.getElementById('reply-target-bar').style.display = 'none';
    currentPage = 0; 
    loadGuestbook();
  }catch(e){input.value=text;}
}

let sending=false;
async function safeSendChat(){if(sending)return;sending=true;await sendChat();sending=false;}
document.getElementById('chat-send').addEventListener('click',safeSendChat);
document.getElementById('chat-input').addEventListener('keydown',(e)=>{
  if(e.key==='Enter' && !e.isComposing){e.preventDefault();safeSendChat();}
});
document.getElementById('chat-refresh').addEventListener('click',loadGuestbook);

tick();
setInterval(tick,1000);
ensureNickname().then(()=>{loadGuestbook();loadNotice();loadTopCommenters();loadPhotos();});
</script>
